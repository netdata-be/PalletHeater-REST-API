; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
; Shared by every ESP32 build (DevKit and board); the board sections below add theirs.
; Pinned: espressif32 8.x ships Arduino core 3.x, which this firmware does not
; build with yet (watchdog / BLE API changes). Upgrade deliberately, see README.
platform               = espressif32@7.0.1
framework              = arduino
check_tool             = clangtidy
; Stove this firmware is built for: stored in the firmware (scripts/buildinfo.py)
; and shown in /api/state, the web app, MQTT discovery and the metrics
custom_stove_model     = Piazzetta P220 M
; Minify the web app (esbuild via npx, needs Node.js) and the OpenAPI spec before they are
; gzipped and embedded (scripts/gzip_assets.py): about 30 KB less flash. yes | no;
; the environment variable OPB_MINIFY=0 / 1 overrides it. Without Node.js the build goes on
; without minifying.
custom_minify_webapp   = yes
build_flags            = -DCORE_DEBUG_LEVEL=2
	-DCONFIG_BT_NIMBLE_PINNED_TO_CORE=1
monitor_filters        = colorize
lib_ldf_mode           = deep+
extra_scripts          = pre:scripts/buildinfo.py
	pre:scripts/api_key.py
	pre:scripts/skip_easybutton_touch.py
	pre:scripts/gzip_assets.py
; web app and spec are embedded gzipped (scripts/gzip_assets.py), the CA bundle
; is for HTTPS to GitHub (firmware update check, src/fwUpdate.h)
board_build.embed_files =
	docs/openapi.json.gz
	web/app.html.gz
	certs/x509_crt_bundle.bin
	web/icons/icon.svg
	web/icons/icon-180.png
lib_deps =
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	evert-arias/EasyButton@^2.0.3
	lnlp/EasyLed@^1.1.0
	bblanchon/ArduinoJson@^6.19.2
	h2zero/NimBLE-Arduino@^1.4.2
	knolleary/PubSubClient@^2.8

; Firmware update over HTTP (POST /api/update) - streams the image in one go,
; several times faster than espota which waits for an ack after every 1 KB.
; Needs firmware that already contains /api/update, and the API key of the
; controller in the environment: export OPB_API_KEY=<key> (GET /api/auth).
[http_upload]
upload_protocol        = custom
upload_command         = curl --fail-with-body --progress-bar -o /dev/stdout -H "X-API-Key: $OPB_API_KEY" -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/update

; ── ESP32 DevKit (pins: src/board.h) ─────────────────────────────────────
; Without Bluetooth (-DOPB_BLUETOOTH=0, NimBLE not linked): with it the image (1.97 MB) no longer
; fits an app slot of min_spiffs.csv (1.875 MB). The S3 board (8 MB) keeps Bluetooth.
[devkit]
extends                = common
board                  = esp32doit-devkit-v1
board_build.partitions = min_spiffs.csv
build_flags            = ${common.build_flags}
	-DOPB_BLUETOOTH=0
lib_ignore             = NimBLE-Arduino

[env:esp32doit-devkit-v1-ota]
extends                = devkit
upload_protocol        = espota
upload_port            = 192.168.50.222
; OTA password = the API key of the controller (web app: Settings, or GET /api/auth):
;   export OPB_API_KEY=<key>   (passed as --auth by scripts/api_key.py; building works without it)
monitor_port           = socket://192.168.50.222:23

[env:esp32doit-devkit-v1-http]
extends                = devkit
upload_protocol        = ${http_upload.upload_protocol}
upload_command         = ${http_upload.upload_command}
upload_port            = 192.168.50.222
monitor_port           = socket://192.168.50.222:23

[env:esp32doit-devkit-v1-serial]
extends                = devkit
monitor_speed          = 115200
upload_port            = /dev/tty.usbserial-0001

; ── OpenPelletBridge board: ESP32-S3-MINI-1-N8, 8 MB flash, no PSRAM ───────
; esp32-s3-devkitc-1 is the N8 variant of the same chip (8 MB quad flash, no PSRAM): the
; module needs nothing else, so no own board JSON. -DBOARD_OPB_S3 selects the pins (board.h).
; Console on the native USB (USB Serial/JTAG, IO19 / IO20): no USB-serial chip on the board.
[s3]
extends                = common
board                  = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions/opb_s3_8mb.csv
build_flags            = ${common.build_flags}
	-DBOARD_OPB_S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed          = 115200

; Over USB: pio run -e opb-s3 -t upload (the port is found by itself, or --upload-port).
; The very first flash of an empty module: hold BOOT, press RESET.
[env:opb-s3]
extends                = s3

; Same image over WiFi: pio run -e opb-s3-http -t upload --upload-port <ip of the board>
[env:opb-s3-http]
extends                = s3
upload_protocol        = ${http_upload.upload_protocol}
upload_command         = ${http_upload.upload_command}

; Same image over Bluetooth LE (scripts/ble_ota_upload.py, ble_ota.py; needs bleak). Only the
; board: the DevKit is built without Bluetooth.
[env:opb-s3-ble-ota]
extends                = s3
upload_protocol        = custom
extra_scripts          = ${common.extra_scripts}
	scripts/ble_ota_upload.py

[env:native]
; Unit tests of the pure logic (lib/pelletcore) on the development machine:
;   pio test -e native
; Needs a host C++ compiler (clang on macOS, gcc on Linux).
platform               = native
test_framework         = unity
build_flags            = -std=c++17 -Wall -Wextra
lib_deps               =
lib_compat_mode        = off
