; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform               = espressif32
board                  = esp32doit-devkit-v1
framework              = arduino
check_tool             = clangtidy
ota_password           = F33D765C-7ACD-443A-9D42-A4C226C4E63F
build_flags            = -DCORE_DEBUG_LEVEL=2
	-DOTA_PASSWORD=\"${common.ota_password}\"
	-DCONFIG_BT_NIMBLE_PINNED_TO_CORE=1
monitor_filters        = colorize
lib_ldf_mode           = deep+
board_build.partitions = min_spiffs.csv
extra_scripts          = pre:scripts/buildinfo.py
board_build.embed_txtfiles =
	docs/openapi.json
	web/app.html
lib_deps =
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	evert-arias/EasyButton@^2.0.3
	lnlp/EasyLed@^1.1.0
	bblanchon/ArduinoJson@^6.19.2
	lennarthennigs/ESP Telnet@^2.2.3
	h2zero/NimBLE-Arduino@^1.4.2

[env:esp32doit-devkit-v1-ota]
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
check_tool             = ${common.check_tool}
build_flags            = ${common.build_flags}
monitor_filters        = ${common.monitor_filters}
lib_ldf_mode           = ${common.lib_ldf_mode}
board_build.partitions = ${common.board_build.partitions}
board_build.embed_txtfiles = ${common.board_build.embed_txtfiles}
lib_deps               = ${common.lib_deps}
extra_scripts          = ${common.extra_scripts}
upload_protocol        = espota
upload_port            = 192.168.50.222
upload_flags           = --auth=${common.ota_password}
monitor_port           = socket://192.168.50.222:23

[env:esp32doit-devkit-v1-http]
; Firmware update over HTTP (POST /api/update) - streams the image in one go,
; several times faster than espota which waits for an ack after every 1 KB.
; Needs firmware that already contains /api/update.
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
check_tool             = ${common.check_tool}
build_flags            = ${common.build_flags}
monitor_filters        = ${common.monitor_filters}
lib_ldf_mode           = ${common.lib_ldf_mode}
board_build.partitions = ${common.board_build.partitions}
board_build.embed_txtfiles = ${common.board_build.embed_txtfiles}
lib_deps               = ${common.lib_deps}
extra_scripts          = ${common.extra_scripts}
upload_protocol        = custom
upload_port            = 192.168.50.222
upload_command         = curl --fail-with-body --progress-bar -o /dev/stdout -H "X-OTA-Password: ${common.ota_password}" -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/update
monitor_port           = socket://192.168.50.222:23

[env:esp32doit-devkit-v1-serial]
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
check_tool             = ${common.check_tool}
build_flags            = ${common.build_flags}
monitor_filters        = ${common.monitor_filters}
monitor_speed          = 115200
lib_ldf_mode           = ${common.lib_ldf_mode}
board_build.partitions = ${common.board_build.partitions}
board_build.embed_txtfiles = ${common.board_build.embed_txtfiles}
lib_deps               = ${common.lib_deps}
extra_scripts          = ${common.extra_scripts}
upload_port            = /dev/tty.usbserial-0001

[env:esp32doit-devkit-v1-ble-ota]
platform               = ${common.platform}
board                  = ${common.board}
framework              = ${common.framework}
check_tool             = ${common.check_tool}
build_flags            = ${common.build_flags}
monitor_filters        = ${common.monitor_filters}
lib_ldf_mode           = ${common.lib_ldf_mode}
board_build.partitions = ${common.board_build.partitions}
board_build.embed_txtfiles = ${common.board_build.embed_txtfiles}
lib_deps               = ${common.lib_deps}
upload_protocol        = custom
extra_scripts          = ${common.extra_scripts}
	scripts/ble_ota_upload.py
