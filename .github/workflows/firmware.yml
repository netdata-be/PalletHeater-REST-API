# Builds the ESP32 firmware on every push and pull request and keeps it as a
# workflow artifact. A tag vX.Y.Z also publishes a GitHub release with the images;
# the controller finds that release itself (src/fwUpdate.h, /api/firmware).
#
# Release:  git tag v1.0.0 && git push origin v1.0.0
# Assets per board; each controller installs only the OTA image of its own board
# (pc::firmwareAssetRank, /api/firmware) and refuses an image for the other chip (src/fwImage.h).
#   ESP32 DevKit (env esp32doit-devkit-v1-http):
#     openpelletbridge-firmware.bin         OTA image: the web app, POST /api/update or the
#                                           GitHub update of the controller. Name fixed: the
#                                           firmware in the field looks for exactly this name
#     openpelletbridge-factory.bin          complete flash image for a new ESP32, at offset 0:
#                                           esptool.py --chip esp32 write_flash 0x0 openpelletbridge-factory.bin
#     openpelletbridge-firmware.elf         debug symbols: decode a core dump (/api/coredump) or backtrace
#   OpenPelletBridge board, ESP32-S3 (env opb-s3): the same three, named openpelletbridge-opb-s3-*
#     (released firmware up to v1.4.x matches its asset name exactly, so it never picks these)
#     openpelletbridge-opb-s3-factory.bin   esptool.py --chip esp32s3 write_flash 0x0 openpelletbridge-opb-s3-factory.bin
#   SHA256SUMS                              all of the above
name: Firmware

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIO_ENV: esp32doit-devkit-v1-http   # all ESP32 envs build the same image, they differ only in upload method

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs the history and tags: it is the firmware version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install "platformio==6.2.0"

      - name: Version
        id: version
        run: |
          # a tag build matches its own tag: several tags can point to the same
          # commit (scripts/buildinfo.py does the same for the firmware version)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=$(git describe --tags --always --dirty --match "$GITHUB_REF_NAME")
          else
            v=$(git describe --tags --always --dirty)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $v"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$v" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::git describe ($v) does not match the tag ${GITHUB_REF_NAME}"; exit 1
          fi

      - name: Prepare src/buildinfo.cpp
        # scripts/buildinfo.py writes src/buildinfo.cpp (not in git) during the first build.
        # PlatformIO wipes all of .pio/build when the list of source files changes between
        # two `pio run` calls, so a new file after the first build would delete the firmware
        # of the previous step. Create it up front; the build overwrites it.
        run: touch src/buildinfo.cpp

      - name: Unit tests (native)
        run: pio test -e native

      - name: Check web app (syntax, texts in both languages)
        run: node scripts/check_webapp.mjs web/app.html

      - name: Validate OpenAPI spec
        run: |
          pip install "openapi-spec-validator==0.9.0"
          python -m openapi_spec_validator docs/openapi.json

      - name: Build firmware
        run: pio run -e "$PIO_ENV"

      - name: Build BLE OTA environment
        # same sources, but its own upload script (scripts/ble_ota_upload.py): make
        # sure that environment still configures and builds
        run: pio run -e esp32doit-devkit-v1-ble-ota

      - name: Build OpenPelletBridge board (ESP32-S3)
        run: pio run -e opb-s3

      - name: Package
        run: |
          mkdir -p dist
          esptool=$(find ~/.platformio/packages -path '*tool-esptoolpy*/esptool.py' | head -1)
          boot_app0=$(find ~/.platformio/packages -path '*framework-arduinoespressif32*/tools/partitions/boot_app0.bin' | head -1)
          # package <env> <asset prefix> <chip> <bootloader offset> <flash mode> <flash freq> <flash size>
          # Offsets, mode and frequency as PlatformIO flashes them (pio project metadata -e <env>):
          # the bootloader is at 0x1000 on the ESP32, at 0x0 on the ESP32-S3
          package() {
            b=".pio/build/$1"
            cp "$b/firmware.bin" "dist/$2-firmware.bin"
            cp "$b/firmware.elf" "dist/$2-firmware.elf"
            python "$esptool" --chip "$3" merge_bin -o "dist/$2-factory.bin" \
              --flash_mode "$5" --flash_freq "$6" --flash_size "$7" \
              "$4" "$b/bootloader.bin" 0x8000 "$b/partitions.bin" 0xe000 "$boot_app0" 0x10000 "$b/firmware.bin"
          }
          package "$PIO_ENV" openpelletbridge        esp32   0x1000 dio 40m 4MB
          package opb-s3     openpelletbridge-opb-s3 esp32s3 0x0    dio 80m 8MB
          (cd dist && sha256sum -- *.bin *.elf > SHA256SUMS)
          echo "### OpenPelletBridge ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for e in "$PIO_ENV" opb-s3; do
            echo "$e:" >> "$GITHUB_STEP_SUMMARY"
            pio run -e "$e" -t size 2>/dev/null | grep -E "^(RAM|Flash):" >> "$GITHUB_STEP_SUMMARY" || true
          done
          (cd dist && ls -l -- *.bin *.elf | awk '{print $5, $9}') >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          # images, ELFs (debug symbols: decode a core dump) and SHA256SUMS of both boards
          name: openpelletbridge-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openpelletbridge-${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # a tag with a suffix (v1.2.0-rc1) becomes a pre-release: the controllers
          # only look at the latest full release
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "OpenPelletBridge $TAG" --generate-notes $pre
