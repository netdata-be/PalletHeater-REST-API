<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PelletBridge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>OpenPelletBridge</title>
<script>try{var th=localStorage.getItem("theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#16191d;--muted:#69707a;--line:#e3e6ea;
  --accent:#e8590c;--accent-soft:#fff0e6;--ok:#2b8a3e;--warn:#e67700;--err:#c92a2a;
  --seg:#eef0f3;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  /* chart series: dataviz palette slots 1-7 in fixed order (validated light + dark) */
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--grid:#e9ecef;
  /* virtual remote */
  --lcd:#dfe5d6;--lcd-ink:#1c2418;--remote:#2a2f36;--remote-btn:#3a4049;
}
/* dark: follows the device (auto), or forced with the theme button (data-theme on <html>) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418;--card:#1a1e23;--text:#e9ecef;--muted:#9aa2ad;--line:#2b3138;
  --accent:#ff7a2e;--accent-soft:#3a2416;--ok:#51cf66;--warn:#fcc419;--err:#ff6b6b;
  --seg:#242a31;--shadow:none;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--grid:#262c33;
  --lcd:#b9c4ad;--lcd-ink:#141a10;--remote:#0d1013;--remote-btn:#262b31;
}}
:root[data-theme="dark"]{
  --bg:#111418;--card:#1a1e23;--text:#e9ecef;--muted:#9aa2ad;--line:#2b3138;
  --accent:#ff7a2e;--accent-soft:#3a2416;--ok:#51cf66;--warn:#fcc419;--err:#ff6b6b;
  --seg:#242a31;--shadow:none;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--grid:#262c33;
  --lcd:#b9c4ad;--lcd-ink:#141a10;--remote:#0d1013;--remote-btn:#262b31;
}
:root{color-scheme:light dark} :root[data-theme="light"]{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.bar h1{font-size:17px;margin:0;font-weight:650;flex:1}
.bar h1 .ver{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.bar h1{font-size:15px;min-width:0}.bar h1 .ver{display:block;margin-left:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.conn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}
@media (max-width:640px){#connStoveTxt{display:none}}
.lang button{padding:3px 9px;min-width:0;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 button,.card h2 .seg{text-transform:none;letter-spacing:0}
.wide{grid-column:1/-1}
/* two columns inside a full-width card (device: info left, settings right), one column on narrow screens */
.cols2{display:grid;gap:12px 32px;grid-template-columns:1fr 1fr;align-items:start}
.cols2 .devfirst{padding-top:0}
@media (max-width:760px){.cols2{grid-template-columns:1fr}.cols2 .devfirst{border-top:1px solid var(--line);padding-top:12px}}
/* alerts */
#alerts{grid-column:1/-1;display:grid;gap:8px}
#alerts:empty{display:none}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;border:1px solid;font-weight:550}
.alert .ic{font-size:18px;line-height:1.2;flex:none}
.alert small{display:block;font-weight:400;opacity:.9}
.alert.critical{background:color-mix(in srgb,var(--err) 12%,var(--card));border-color:color-mix(in srgb,var(--err) 45%,transparent);color:var(--err)}
.alert.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card));border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:color-mix(in srgb,var(--ok) 75%,var(--text))}
.alert.warning{background:color-mix(in srgb,var(--warn) 14%,var(--card));border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:color-mix(in srgb,var(--warn) 70%,var(--text))}
/* hero */
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.hero .state{flex:1;min-width:200px}
.state-label{font-size:26px;font-weight:700;line-height:1.2}
.state-sub{color:var(--muted);font-size:14px}
.next{font-size:13px;margin-top:4px;color:var(--muted)}
.next b{color:var(--text);font-weight:600}
.big-temps{display:flex;gap:24px;flex-wrap:wrap}
.big-temps div{min-width:90px}
.big-temps .v{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}
.big-temps .l{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--seg);color:var(--muted)}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.err{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0}
dt{color:var(--muted)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
#esDetails .row:first-of-type{border-top:1px solid var(--line);padding-top:10px}
.row .lbl{font-weight:500}.row .hint{display:block;font-size:12px;color:var(--muted);font-weight:400}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:550}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--err)}
/* power button: green = turn on, red = turn off (fixed shades: white text stays readable in dark mode) */
button.go{background:#2b8a3e;border-color:#2b8a3e;color:#fff}
button.stop{background:#c92a2a;border-color:#c92a2a;color:#fff}
button.go:hover,button.stop:hover{filter:brightness(1.08)}
button.big{padding:12px 22px;font-size:16px;border-radius:12px}
.seg{display:inline-flex;background:var(--seg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;min-width:40px}
.seg button.active{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--accent)}
select,input[type=time],input[type=number]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:38px;padding:7px 0}
.stepper .v{min-width:56px;text-align:center;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--seg);border:1px solid var(--line);border-radius:999px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}
.switch input:checked+span:before{transform:translateX(18px)}
/* timers */
.timers{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.timer{border:1px solid var(--line);border-radius:12px;padding:12px}
.timer.off .tbody{opacity:.55}
.timer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.timer-head b{font-size:16px}
.tgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.tgrid label{color:var(--muted);font-size:13px}
.tgrid input,.tgrid select{width:100%}
.tgrid .seg,.tgrid .stepper{justify-self:start}
.tpick{display:block}
.tp-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:7px 12px;border-radius:10px;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:left}
.tp-btn svg{width:16px;height:16px;flex:none;color:var(--muted)}
.tp-btn.off{color:var(--muted);font-weight:500;font-size:15px}
.tp-btn:hover svg,.tp-btn[aria-expanded=true] svg{color:var(--accent)}
.tp-btn[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#tpPop{position:absolute;z-index:25;display:none;width:288px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.22);padding:14px}
#tpPop .tp-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
#tpPop .tp-now{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#tpPop .tp-now span{color:var(--accent)}
#tpPop .tp-now.off{color:var(--muted);font-size:20px}
#tpPop .tp-sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 2px 6px}
#tpPop .tp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:12px}
#tpPop .tp-grid button{min-width:0;padding:8px 0;border:0;border-radius:9px;background:var(--seg);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .12s,transform .08s}
#tpPop .tp-grid button:hover{background:var(--accent-soft);color:var(--accent)}
#tpPop .tp-grid button:active{transform:scale(.95)}
#tpPop .tp-grid button.sel{background:var(--accent);color:#fff}
#tpPop .tp-grid.min button{padding:10px 0;font-size:15px}
#tpPop .tp-foot{display:flex;justify-content:space-between;gap:8px}
#tpPop .tp-foot button{flex:1}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{padding:5px 0;width:38px;font-size:12px;border-radius:8px}
.days button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.timer-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.timer-foot select{max-width:150px;font-size:13px;padding:6px 8px}
/* errors */
.errlist{list-style:none;margin:0;padding:0}
.errlist li{padding:8px 0;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.errlist li{align-items:center;flex-wrap:wrap}
.errlist li .etext{flex:1 1 320px;min-width:0}
.errlist li .ewhen{flex:none;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.errlist li button{padding:4px 10px;font-size:13px;flex:none}
.errlist li:first-child{border-top:0}
.errlist b{color:var(--err);margin-right:6px}
.muted{color:var(--muted)}
.help{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:0;padding:0;margin-left:6px;border-radius:50%;font-size:11px;font-weight:700;line-height:1;color:var(--muted);vertical-align:1px;text-transform:none;letter-spacing:0}
.help:hover,.help[aria-expanded=true]{color:var(--accent);border-color:var(--accent)}
#pop{position:absolute;z-index:20;max-width:340px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;white-space:pre-line}
#pop .src{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a{color:var(--accent)}
/* charts */
.chart{position:relative;margin-top:6px}
.chart + .chart{margin-top:18px}
.chart-title{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.chart-title b{color:var(--text);font-weight:600;margin-right:4px}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:14px;height:0;border-top:2px solid currentColor}
.key i.step{border-top-style:dashed}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart svg text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart svg .lbl{fill:var(--text);font-size:11px;font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);min-width:130px;display:none;z-index:2}
.tip .tt{color:var(--muted);margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .tr span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tip .tr span i{display:inline-block;width:12px;border-top:2px solid}
.tip .tr b{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--muted)}
.chip:not(.on) i{opacity:.35}
.chip i{display:inline-block;width:14px;border-top:2px solid}
.chip i.vline{width:0;height:12px;border-top:0;border-left:1px dashed var(--muted)}
.chart svg .lane{fill:var(--text);font-size:12px;font-weight:600}
details.tbl{margin-top:12px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--muted)}
details.tbl .scroll{max-height:240px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
details.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
details.tbl th,details.tbl td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
details.tbl th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:600}
details.tbl th:first-child,details.tbl td:first-child{text-align:left}
/* virtual remote */
.remote-wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.remote{width:170px;flex:none;background:var(--remote);border-radius:28px 28px 22px 22px;padding:18px 16px 20px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:6px;height:118px;padding:5px 7px;position:relative;font-family:"Courier New",ui-monospace,monospace;font-weight:700;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);text-transform:uppercase}
.lcd .top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.02em;padding-right:18px}
.lcd .ic{display:inline-flex;line-height:0}
.lcd .cic{display:flex;justify-content:center;margin-top:4px}
.lcd .chr{position:absolute;right:6px;top:4px}
.lcd .big{font-size:26px;text-align:center;line-height:1.1;margin-top:4px}
.lcd .big.huge{font-size:34px}
.lcd .big3{font-size:25px;text-align:center;line-height:1;margin-top:5px;letter-spacing:.02em}
.lcd .big.inv{background:var(--lcd-ink);color:var(--lcd);border-radius:3px;margin:4px auto 0;width:max-content;padding:0 6px}
.lcd .mid{font-size:12px;text-align:center;margin-top:10px;line-height:1.2}
.lcd .ttl.small{font-size:10px;line-height:1.25}
.lcd .ttl{font-size:13px;text-align:center;line-height:1.2;margin-top:4px;letter-spacing:.03em}
.lcd .menuhdr{font-size:11px;letter-spacing:.08em}
.lcd .mname{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:14px;line-height:1.15;letter-spacing:.03em}
.lcd .mname.noic{top:34px;bottom:auto}
.lcd .row1{display:flex;align-items:center;justify-content:center;gap:12px;height:80px}
.lcd .row2{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;font-size:20px}
.lcd .row2 .lbl2{font-size:14px}
.lcd .foot{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px}
.lcd .spk{display:flex;justify-content:center;gap:24px;margin-top:4px}
.lcd .spk .ul{border-bottom:2px solid currentColor}
.lcd .days7{display:flex;justify-content:center;gap:6px;font-size:12px;margin-top:4px}
.lcd .days7 .u{text-decoration:underline}
.lcd .fld{text-align:center;font-size:22px;margin-top:2px}
.lcd .fld.sm{font-size:14px}
.lcd .inv{background:var(--lcd-ink);color:var(--lcd);padding:0 2px;border-radius:2px}
.lcd.list{padding-top:3px}
.lcd.list .ttl{margin:0 0 2px;font-size:11px}
.lcd .li.sm{font-size:10px;letter-spacing:-.04em}
.lcd .li{font-size:11.5px;line-height:1.38;white-space:pre}
.lcd .bars{position:absolute;left:38px;bottom:24px;display:flex;gap:5px;align-items:flex-end}
.lcd .bars div{display:flex;flex-direction:column;align-items:center;font-size:9px;line-height:1}
.lcd .bars span{display:block;width:17px;border:1.5px solid var(--lcd-ink);margin-top:1px}
.lcd .bars span.f{background:var(--lcd-ink)}
.lcd .eco{position:absolute;right:7px;top:52px;font-size:14px}
.lcd .msg{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:14px;letter-spacing:.04em}
.lcd .warnmsg{position:absolute;right:6px;bottom:4px;font-size:10px}
.lcd .fan{position:absolute;left:6px;bottom:4px;display:flex;align-items:center;gap:3px;font-size:12px}
/* CHRONO program screen (PR1-PR6), layout as on the GRF remote; sized for the ~138 px wide LCD */
.lcd.chrono{padding:4px 4px}
.lcd .chtop{display:flex;align-items:flex-end;gap:3px;height:22px}
.lcd .chpr{font-size:14px;line-height:1;letter-spacing:-.02em}
.lcd .chon{font-size:8px;border:1.2px solid var(--lcd-ink);padding:0 1px;line-height:10px;margin-bottom:2px}
.lcd .chdays{display:flex;gap:1px;margin-left:auto}
.lcd .chd{display:flex;flex-direction:column;align-items:center;width:8px;font-size:8px;line-height:1}
.lcd .chd b{display:block;width:8px;text-align:center}
.lcd .chd i{display:block;width:7px;height:7px;border:1.2px solid var(--lcd-ink);margin-top:1px}
.lcd .chd i.f{background:var(--lcd-ink)}
.lcd .chdays.inv{background:none;color:inherit;padding:0;border-radius:0}   /* only the digits are inverted */
.lcd .chdays.inv .chd b{background:var(--lcd-ink);color:var(--lcd)}
.lcd .chgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:3px}
.lcd .chbox{border:1.2px solid var(--lcd-ink);border-radius:3px;height:38px;padding:1px 2px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.lcd .chbox .chl{font-size:7px;line-height:1}
.lcd .chbox .chv{font-size:11px;text-align:right;line-height:1.1;letter-spacing:-.03em}
.lcd .chbox.ci{flex-direction:row;align-items:center;justify-content:space-between}
.lcd .chbox.ci .chv{font-size:15px}
.lcd .chbox.inv{background:var(--lcd-ink);color:var(--lcd)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:16px;justify-items:center}
.rbtns span{width:34px;height:30px;border-radius:9px;background:var(--remote-btn);color:#c9cfd6;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;opacity:.7}
.rbtns span.pw{grid-column:1/-1;border-radius:50%;width:32px;height:32px}
.remote-info{flex:1;min-width:200px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-wrap:anywhere}
.keybtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
[hidden]{display:none!important}   /* class display rules must not override the hidden attribute */
.altlist{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.altlist .alt{display:flex;gap:6px;align-items:center}
.altlist input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;color:inherit}
.altlist input.bad{border-color:var(--err)}
.altlist button{padding:5px 12px;font-size:13px}
.mqform{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:4px 0 12px;font-size:13px}
.mqform label{display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.mqform label:has(input[type=checkbox]){flex-direction:row;align-items:center;justify-content:space-between;color:var(--text)}
.bzev{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 8px;align-items:center;grid-column:1/-1;color:var(--text)}
.bzev select{font-size:13px;padding:5px 8px}
.mqform input:not([type=checkbox]){width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--text)}
@media (max-width:420px){.mqform{grid-template-columns:1fr}}
.fwprog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 0 10px}
.fwprog div{height:100%;width:0;background:var(--accent);transition:width .2s}
.keybtns button{padding:5px 10px;font-size:13px}
#keyModal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
#keyModal.show{display:flex}
#keyModal .mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#keyModal h3{margin:0 0 6px;font-size:17px}
#keyModal p{margin:0 0 12px;color:var(--muted);font-size:14px}
#keyModal input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;color:inherit}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:transform .2s;max-width:calc(100% - 32px);z-index:10}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--err);color:#fff}
/* expert mode: .x elements only show with the Expert toggle */
body:not(.expert) .x{display:none!important}
/* debug mode: .d elements (raw registers, research tables) only show with the Debug toggle */
body:not(.debug) .d{display:none!important}
.xbtn{padding:4px 11px;font-size:12px;border-radius:999px;min-width:0;color:var(--muted)}
.xbtn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
/* stove (or controller) unreachable: data is old, controls do nothing */
.card.dim{opacity:.45;filter:grayscale(1);pointer-events:none;user-select:none;transition:opacity .2s}
/* parameter tables (debug) */
.hypwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.hyp{width:100%;border-collapse:collapse;font-size:13px}
.hyp th,.hyp td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.hyp tr:last-child td{border-bottom:0}
.hyp tr.cur td{background:var(--accent-soft)}
.hyp td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tsub{font-size:13px;font-weight:600;margin:4px 0 6px}
.tsub:not(:first-of-type){margin-top:16px}
.hyp th{color:var(--muted);font-weight:600;background:var(--card);white-space:nowrap}
.hyp td.r{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.hyp td.v{white-space:nowrap;font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.hyp td.o{color:var(--muted);min-width:180px}
.hyp td.h{min-width:200px}
@media (max-width:420px){main{padding:12px;gap:12px;grid-template-columns:1fr}.big-temps{gap:16px}.big-temps .v{font-size:24px}.bar{gap:8px}.conn span:last-child{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
/* keyboard focus (accessibility) */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* update badge in the header */
.xbtn.upd{border-color:var(--accent);color:var(--accent);font-weight:650}
@media (max-width:560px){#updBadge .v{display:none}}
/* header: one row; on a phone two (title + connection on top, the buttons below), otherwise
   the title ran under the buttons (iPhone, 20/11/2026) */
.bar .brk{display:none}
@media (max-width:560px){
  .bar{flex-wrap:wrap;row-gap:8px}
  .bar h1{order:0}
  .bar .conn{order:1}
  .bar .brk{display:block;order:2;flex-basis:100%;height:0}
  .bar .xbtn{order:3}
}
/* read planner (expert) */
.plan td{vertical-align:middle}
.plan .bar{position:relative;height:8px;border-radius:4px;background:var(--seg);min-width:120px;overflow:hidden}
.plan .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--s1)}
.plan .bar i.late{background:var(--warn)}
.plan .bar b{position:absolute;top:0;bottom:0;left:25%;width:2px;background:var(--text);opacity:.35}
.plan .bar u{position:absolute;top:-1px;bottom:-1px;width:3px;margin-left:-1px;background:var(--ok);border-radius:1px;display:none}
.plan tr.pr td{background:var(--seg);font-weight:600;font-size:12px;color:var(--muted)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:4px}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
/* pellet use per day */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:2px 0 10px}
.kpi{background:var(--seg);border-radius:10px;padding:8px 12px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .s{font-size:12px;color:var(--muted)}
#useChart line.g{stroke:var(--grid);stroke-width:1}
/* pellet estimate (debug) */
.pdstage{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pdchecks{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;font-size:13px}
.pdchecks li{display:flex;gap:8px;align-items:baseline}
.pdchecks li .pill{flex:none;min-width:44px;text-align:center}
.hyp td.f{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
/* live debugging */
.livebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.livebar input[type=text]{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.livebar label{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--muted)}
.liveout{height:380px;overflow:auto;background:var(--seg);border-radius:10px;padding:10px 12px;margin:10px 0 6px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.loglvl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;padding:8px 0}
.loglvl label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.loglvl label span{color:var(--muted)}
.liveout .warn{color:var(--warn)}
/* console dock */
.devtools{position:fixed;left:0;right:0;bottom:0;z-index:25;height:var(--dth,340px);max-height:calc(100vh - 60px);background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.devtools[hidden]{display:none!important}
body.dtopen{padding-bottom:var(--dth,340px)}
.dtgrip{height:7px;flex:none;cursor:ns-resize;touch-action:none}
.dtgrip:hover,.dtgrip.drag{background:var(--accent-soft)}
.dthead{display:flex;align-items:center;gap:12px;padding:2px 16px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dttitle{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dtstat{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtclose{border:0;background:transparent;font-size:20px;line-height:1;padding:2px 8px}
.dtbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 16px}
.devtools .livewrap{flex:1;min-height:0;display:flex;flex-direction:column;margin:0}
.devtools .liveout{flex:1;height:auto;min-height:40px;margin:0}
.devtools .livelegend{margin:0}
.xbtn.alert{border-color:var(--err);color:var(--err)}
button.mini{padding:1px 8px;font-size:11px;font-weight:550;border-radius:7px;margin-left:8px;vertical-align:1px}
.histnav{display:flex;align-items:center;gap:8px;margin-top:4px}
.histnav .sp{flex:1}
.histnav button.mini{margin-left:0}
.liveout .warn{color:var(--warn)}
.livewrap{margin:10px 0 6px}
.livewrap .liveout{margin:0}
.livehdr{font:600 12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);background:var(--seg);border-radius:10px 10px 0 0;padding:8px 12px 4px;border-bottom:1px solid var(--line);white-space:pre;overflow:hidden}
.livehdr:not([hidden])+.liveout{border-radius:0 0 10px 10px}
.livelegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:0 0 6px}
.livelegend span{display:inline-flex;align-items:center;gap:6px}
.livelegend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:currentColor}
.liveout .first{color:var(--muted)}
.liveout .raw{color:var(--muted)}
.liveout .retry{color:var(--warn)}
.liveout .err{color:var(--err)} .liveout .w{color:var(--accent);font-weight:600} .liveout .ch{color:var(--ok)} .liveout .lost{color:var(--muted);font-style:italic}
/* backup / restore dialog */
#bkModal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
#bkModal.show{display:flex}
#bkModal .mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#bkModal h3{margin:0 0 6px;font-size:17px}
#bkModal p{margin:0 0 12px;color:var(--muted);font-size:14px}
.bksec{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14px}
.bksec input{margin-top:3px}
</style>
</head>
<body>
<header><div class="bar">
  <h1>OpenPelletBridge <span class="ver" id="appVer"></span></h1>
  <button id="updBadge" class="xbtn upd" type="button" hidden></button>
  <button id="themeBtn" class="xbtn" type="button"></button>
  <button id="consoleBtn" class="xbtn" type="button" data-i="console"></button>
  <button id="expertBtn" class="xbtn" type="button" aria-pressed="false" data-i="expert"></button>
  <button id="debugBtn" class="xbtn" type="button" aria-pressed="false" data-i="debug"></button>
  <div class="conn" id="connStove"><span class="dot" id="dotStove"></span><span id="connStoveTxt">…</span></div>
  <div class="conn" id="connCtl"><span class="dot" id="dot"></span><span id="conn">…</span></div>
  <span class="brk" aria-hidden="true"></span>
</div></header>

<main>
  <div id="alerts" role="status" aria-live="polite"></div>

  <!-- Overview -->
  <section class="card wide">
    <div class="hero">
      <div class="state">
        <div class="state-label" id="stateLabel">–</div>
        <div class="state-sub" id="stateSub">&nbsp;</div>
        <div class="next" id="nextTimer"></div>
      </div>
      <div class="big-temps">
        <div><div class="v" id="tRoom">–</div><div class="l" id="tRoomLbl"></div></div>
        <div><div class="v" id="tSet">–</div><div class="l" data-i="setPoint"></div></div>
        <div><div class="v" id="tFume">–</div><div class="l" data-i="fumes"></div></div>
      </div>
      <button class="big go" id="powerBtn" disabled>–</button>
    </div>
  </section>

  <!-- Heating controls -->
  <section class="card">
    <h2 data-i="heating"></h2>
    <div class="row">
      <span class="lbl"><span data-i="setPoint"></span><span data-help="setPoint"></span></span>
      <span class="stepper">
        <button data-step="-1" aria-label="−">−</button>
        <span class="v" id="spVal">–</span>
        <button data-step="1" aria-label="+">+</button>
      </span>
    </div>
    <div class="row">
      <span class="lbl"><span data-i="flamePower"></span><span data-help="flame"></span><span class="hint" id="flameHint">&nbsp;</span></span>
      <span class="seg" id="flameSeg"></span>
    </div>
    <div class="row">
      <span class="lbl"><span data-i="roomFan"></span><span data-help="fan"></span><span class="hint" id="fanHint"></span></span>
      <span class="seg" id="fanSeg"></span>
    </div>
  </section>

  <!-- Energy saving -->
  <section class="card">
    <h2 data-i="energySaving"></h2>
    <div class="row">
      <span class="lbl"><span data-i="energySaving"></span><span data-help="es"></span><span class="hint" data-i="esHint"></span></span>
      <label class="switch"><input type="checkbox" id="esEnabled"><span></span></label>
    </div>
    <div id="esDetails">
      <div class="row">
        <span class="lbl"><span data-i="esStart"></span><span data-help="esStart"></span><span class="hint" id="esStartHint">&nbsp;</span></span>
        <select id="esStart"><option value="-1">−1 °C</option><option value="-2">−2 °C</option><option value="-3">−3 °C</option><option value="0" data-i="esStartOff"></option></select>
      </div>
      <div class="row">
        <span class="lbl"><span data-i="esStop"></span><span data-help="esStop"></span><span class="hint" id="esStopHint">&nbsp;</span></span>
        <select id="esStop"><option value="1">+1 °C</option><option value="2">+2 °C</option><option value="3">+3 °C</option></select>
      </div>
    </div>
  </section>

  <!-- Status details -->
  <section class="card">
    <h2 data-i="status"></h2>
    <dl id="statusList"></dl>
  </section>

  <!-- History -->
  <section class="card wide">
    <h2><span data-i="history"></span>
      <span class="seg" id="rangeSeg"><button data-h="0.5">30 min</button><button data-h="1">1 h</button><button data-h="6">6 h</button><button data-h="12">12 h</button><button data-h="24">24 h</button><button data-h="168">7 d</button></span></h2>
    <div class="chips" id="histToggles"></div>
    <div id="histEmpty" class="muted" style="display:none"></div>
    <div id="histCharts">
      <div class="chart" id="histChart"><svg role="img"></svg><div class="tip"></div></div>
      <div class="histnav"><button class="mini" id="histPrev" type="button"></button><button class="mini" id="zoomReset" type="button" hidden></button><span class="sp"></span><button class="mini" id="histNext" type="button"></button></div>
      <p class="muted" style="font-size:12px;margin:6px 0 0" id="histNote"></p>
      <details class="tbl x"><summary data-i="showTable"></summary><div class="scroll"><table id="histTable"></table></div></details>
    </div>
    <details class="tbl" id="evtBox" style="display:none"><summary data-i="evtTitle"></summary><div class="scroll"><table id="evtTable"></table></div></details>
  </section>

  <!-- Pellet use per day and cost (GET /api/pellets/days, /api/pellets usage) -->
  <section class="card wide" id="useCard">
    <h2><span><span data-i="useTitle"></span><span data-help="use"></span></span>
      <span class="seg" id="useSeg"><button data-d="14">14 d</button><button data-d="31">30 d</button><button data-d="92">3 m</button><button data-d="366">1 j</button></span></h2>
    <div class="kpis" id="useKpis"></div>
    <div class="chart" id="useChart"><svg role="img"></svg><div class="tip"></div></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0" id="useNote"></p>
    <div class="actions"><button id="usePrice"></button><button id="useStock"></button><button id="useLoc"></button></div>
    <details class="tbl"><summary data-i="showTable"></summary><div class="scroll"><table id="useTable"></table></div></details>
    <div class="tsub" style="margin-top:16px"><span data-i="wxTitle"></span><span data-help="wx"></span></div>
    <div class="kpis" id="wxKpis"></div>
    <div class="chart" id="wxChart"><svg role="img"></svg><div class="tip"></div></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0" id="wxNote"></p>
  </section>

  <!-- Remote control -->
  <section class="card">
    <h2 data-i="remoteCard"></h2>
    <div class="remote-wrap">
      <div class="remote" aria-hidden="true">
        <div class="lcd" id="lcd"></div>
        <div class="rbtns" aria-hidden="true"><span>▲</span><span>OK</span><span>▼</span><span>ESC</span><span class="pw">⏻</span></div>
      </div>
      <div class="remote-info">
        <dl id="remoteList"></dl>
        <p class="muted" style="font-size:12px;margin:10px 0 0" data-i="remoteNote"></p>
      </div>
    </div>
  </section>

  <!-- Combustion & settings -->
  <section class="card">
    <h2 data-i="settings"></h2>
    <div class="row">
      <span class="lbl"><span data-i="combustionQuality"></span><span data-help="cq"></span><span class="hint" id="cqHint">&nbsp;</span></span>
      <select id="cq"></select>
    </div>
    <div class="row">
      <span class="lbl"><span data-i="pelletQuality"></span><span data-help="pq"></span><span class="hint" id="pqHint">&nbsp;</span></span>
      <select id="pq"></select>
    </div>
    <div class="row">
      <span class="lbl"><span data-i="beep"></span><span data-help="beep"></span></span>
      <label class="switch"><input type="checkbox" id="beep"><span></span></label>
    </div>
  </section>

  <!-- Clock -->
  <section class="card">
    <h2><span><span data-i="clock"></span><span data-help="clock"></span></span></h2>
    <dl>
      <dt data-i="stove"></dt><dd id="timeStove">–</dd>
      <dt>NTP</dt><dd id="timeNtp">–</dd>
      <dt>Browser</dt><dd id="timeBrowser">–</dd>
      <dt data-i="difference"></dt><dd id="timeDelta">–</dd>
    </dl>
    <div class="actions"><button id="syncTime" data-i="syncClock"></button><button id="syncBrowser" data-i="syncBrowser"></button></div>
  </section>

  <!-- Errors -->
  <section class="card wide">
    <h2><span><span data-i="errorMemory"></span><span data-help="errors"></span></span></h2>
    <ul class="errlist" id="errList"><li class="muted">–</li></ul>
    <div class="actions"><button class="danger" id="clearErrors" data-i="clearErrors"></button></div>
  </section>

  <!-- Timers -->
  <section class="card wide">
    <h2><span><span data-i="timers"></span><span data-help="timers"></span></span><button id="reloadTimers" data-i="reload"></button></h2>
    <div class="next" id="nextTimer2" style="margin:-4px 0 12px"></div>
    <div class="timers" id="timers"></div>
  </section>

  <!-- Device -->
  <section class="card wide" id="devCard">
    <h2 data-i="device"></h2>
    <div class="cols2">
    <dl id="deviceList"></dl>
    <div>
    <div class="row devfirst">
      <span class="lbl"><span data-i="bt"></span><span data-help="bt"></span><span class="hint" id="btHint">&nbsp;</span></span>
      <label class="switch"><input type="checkbox" id="btToggle"><span></span></label>
    </div>
    <div class="row d">
      <span class="lbl"><span>Telnet</span><span data-help="telnet"></span><span class="hint" data-i="telnetHint"></span></span>
      <label class="switch"><input type="checkbox" id="telnetToggle"><span></span></label>
    </div>
    <div class="row">
      <span class="lbl"><span data-i="keyRequired"></span><span data-help="apiKey"></span><span class="hint" id="keyReqHint">&nbsp;</span></span>
      <label class="switch"><input type="checkbox" id="keyReqToggle"><span></span></label>
    </div>
    <div class="row" id="keyRow">
      <span class="lbl"><span data-i="apiKeyLbl"></span><span class="hint mono" id="keyVal">–</span></span>
      <span class="keybtns"><button id="keyShow" data-i="keyShow"></button><button id="keyCopy" data-i="keyCopy"></button><button id="keyRotate" data-i="keyRotate"></button></span>

    h_live:"Firmware log: the messages of the controller firmware (WiFi, MQTT, updates, errors), the same as on the serial port, with the time. Output of some built-in libraries is not included. Stove bus: every read and write between the controller and the stove, one line each: time, action, register (RAM or EEPROM and address), value (decimal and hex) and what the value means according to the known register table. A changed value shows the previous one (← was …). With 'Changes only' (on by default) you see the first reading of each register and then only what changes, writes and failures; the colours are explained under the output. Filter on addresses to follow registers, e.g. while pressing keys on the remote. The bus monitor only records while this view is open and stops by itself 60 s after you leave. After a restart the log starts with the last lines from before it (kept in RTC memory, also after a crash, not after a power cut). Log levels per module set how much each part of the firmware writes (kept on the controller).",

    histNote:"One point every 2 minutes, last 24 hours, stored on the controller (kept across restarts). Temperatures in 0.5 °C steps. State lines are drawn at the exact moment of each change.",
    evtTitle:"State changes, errors and pellet reserve", pelSensor:"Reserve sensor", pelCounter:"Reserve counter", pelV0:"pellets OK", pelV5:"pellets low (reserve)", pelVr:"pellets seen, the stove confirms ({0} → 0)", aRefill:"Pellets refilled – the stove confirms them", aRefillSub:"The level sensor counts down to 0, about {0} left. The low pellet warning has ended.", aRefillOffSub:"The level sensor counts down to 0, about {0} left; then the stove can be switched on again.", emptyConfirming:"Refilled – the stove still confirms the pellets, a moment please", refillConfirm:"refilled · confirming", aEmpty:"Error: pellets used up – stove switched off", aEmptySub:"The pellet reserve ran out and the stove switched itself off. Switching on is blocked until the hopper is refilled (the level sensor sees pellets again).", emptyBlocked:"Refill the pellet hopper first", emptyOff:"empty · stove off", pelVx:"value {0} (meaning unknown)",
pelLeft:"Pellets in the hopper", pelLearning:"being measured: refill at the low pellet alarm, the estimate follows at the next alarm", pelAtAlarm:"at the low pellet alarm level", pelKg:"≈ {0} kg until the alarm", pelAtNow:"{0} at the current power", pelAlarmAt:"alarm expected {0}", pelRefill:"Refilled…", pelLastRefill:"refilled {0} ({1} kg)", pelRefillAsk:"How many kg of pellets did you add? (a refill at the alarm is also detected by itself, with the standard amount)", pelBadKg:"Enter a number of kg", pelRefillDone:"{0} kg added", pelCal:"Pellet use (measured)", pelCalVal:"{0} cycle(s) · {1} kg/h now · standard refill {2} kg", pelCalNone:"no full cycle yet · standard refill {0} kg", pelStd:"Standard…", pelStdAsk:"Standard amount of a refill at the low pellet alarm (kg):", pelStdDone:"Standard refill: {0} kg", h_pelLeft:"Estimate of the pellets left until the low pellet alarm (level sensor in the hopper). The controller counts the auger feed (auger value × time). Between two alarms exactly the pellets you added were burned: that calibrates kg per auger step. A refill is detected when the alarm clears again, with the standard amount (15 kg, change it under Pellet use). Topped up without an alarm, or another amount? Use Refilled… so the count stays right. The first estimate comes after one refill at the alarm and the next alarm; more refills make it more accurate. The time at the current power is only shown while the auger feeds; the expected alarm time uses your average use of the last 7 days.",
    pelReserve:"Pellet reserve", pelReserveVal:"On · sensor {0} · counter {1}", h_pelReserve:"PELLET RESERVE (installer menu, EEPROM 0xC6). Seen on this stove (17/11 and 20/11/2026): when the level sensor (RAM 0xA4) sees low pellets it becomes 5 and the counter (RAM 0x89) counts down from 20 to 0, one step per minute. Then the remote shows PELLET RESERVE with the minutes left, and the stove runs 30 more minutes at flame power 1 (RAM 0x91). After that it switches itself off: the remote shows OFF / PELLET BESTEED and the controller reports the error PELLETS and blocks switching on until the hopper is refilled. After a refill the sensor counts down 5 → 4 → … → 0, one step about every 37 s while the stove burns: only at 0 has the stove confirmed the pellets. Meanwhile the app shows 'Pellets refilled – the stove confirms them' instead of the low pellet warning. A single 4 between two 5's is pellets sliding past the sensor, not a refill. Refilling during the last 30 minutes kept the stove burning (23/11/2026). Changes of the sensor are recorded in the state change list.", evtError:"Error", evtErrOn:"{0} occurred", evtErrOff:"Error cleared", errSeen:"occurred {0}", errSeenUnknown:"time unknown (before the log started)", evtWhen:"Time", evtFrom:"From", evtTo:"To", evtDur:"Duration", evtNone:"No state changes recorded yet.", evtNow:"now",

    ledOnHint:"LED1 system, LED2 stove", ledOffHint:"Off", ledNightNow:"Off now: night", ledSaved:"LED settings saved",
    h_leds:"The two LEDs on the board. LED1 (system): blue = starting / connecting to WiFi, green = WiFi connected, purple double flash = config portal (access point), cyan blinking = firmware update, red double flash = the controller crashed or an update was rolled back (a short press of the button clears it), white blink = button pressed. LED2 (stove): off = stove off, green blip = standby, orange blinking = starting / ignition, orange = burning, blue = brazier cleaning, blue blinking = final cleaning, red fast = alarm / error, magenta blinking = no answer from the stove; a yellow double flash = a warning (pellet reserve, an error counting down, remote sensor not used). 100 % brightness is 40 % of what the LEDs can do (the USB fuse).",

    h_buzzer:"The buzzer on the controller board (not the stove's own beep). Each event has its sound; Test plays it (also when the buzzer is off). Button press: a short press of the button on the board; it also silences a sounding alarm. Firmware update done: a new firmware confirmed after an update. Pellet reserve: when the stove's pellet reserve alarm starts. Error countdown: the stove counts down ~55 s before it acts on an error; a beep every second, faster in the last 10 s. Stove alarm / error: repeats until the error is cleared or silenced. Quiet hours (local time): no sounds, optionally except alarm and countdown. MQTT: <prefix>/set/buzzer (ON / OFF), buzzer_play (a sound), buzzer_stop.",
    h_https:"Encrypted access over https:// on port 443, next to plain HTTP on port 80. The certificate is made on the controller itself (its own ECDSA P-256 key, which never leaves it) for the hostname, hostname.local and the IP address, and is renewed automatically with the same key when one of them changes. It is self-signed: the browser warns the first time. Check that the SHA-256 fingerprint the browser shows is the one here, then accept it; or download the certificate and install it as trusted on your own devices (then no warning). A TLS connection needs ~40 KB of memory: the controller serves one at a time, and refuses it when memory is low (HTTP keeps working).",

    h_telnet:"Interactive debug menu over telnet (port 23): live values, settings, raw register access. Telnet has no password and no encryption; switch it off when you do not use it. The change is applied immediately, without a restart.",
    h_apiKey:"Protects the HTTP API with a key. The key is generated randomly on the first start and kept on the controller. When required, every call needs the header X-API-Key: <key> (or Authorization: Bearer <key>, e.g. for Prometheus). Open without key: the device page, this web app, the API docs and /api/auth. Plain HTTP is not encrypted, so the key protects against other devices and web pages on your network, not against someone sniffing the network. The telnet menu and Bluetooth are not protected by the key.",
    flameSet:"Flame power (set)", flameActual:"Flame power (actual)",
    fanPower:"Room fan power", h_fanPower:"Raw power value the stove sends to the room fan (RAM 0x0A): 0 = off, 21 / 23 / 25 at speed 1 / 2 / 3, the value depends on the speed and the actual flame power: flame 1 → 9 / 14 / 19, flame 2 → 21 / 23 / 25 for speed 1 / 2 / 3, flame 3 → 27 at speed 1. Measured on this stove; the unit is not documented.",
    fanSet:"Room fan (set)", fanActual:"Room fan (actual)", fanRunsAt:"Running at {0}", fanRunsLow:"Running at low power ({0})", fanRunsPower:"Running at {0} (power {1})", fanWaitHeat:"Waiting until the stove is hot enough", fanStopped:"Not running", flameMod:"Modulating: running at {0}", flameNow:"Running at {0}", flameOut:"No flame at the moment",

    btConfirmOff:"Switch Bluetooth off? The controller restarts and the iOS app can then only connect via WiFi.", btConfirmOn:"Switch Bluetooth on? The controller restarts.",
    h_bt:"Switching Bluetooth off skips BLE completely when the controller starts: no Bluetooth advertising or connections, the Bluetooth memory is released and WiFi no longer has to share the radio (no power saving mode needed). This usually gives a faster and more stable WiFi connection. The iOS app then only works via WiFi. The change is applied with a restart of the controller; the stove keeps running.",
    serviceOf:"{0} / 2000 h", tpHour:"Hour", tpMin:"Minutes", tpOff:"OFF", tpDone:"Done",
    h_service:"After 2000 operating hours the remote shows SERVICE when the stove is off: have the stove serviced by an authorised service centre. The stove can still be used.\nThe scheduled maintenance must also be done at least once a year, and before using the stove after a long period of inactivity.\nYourself: glass and brazier daily, ash pan every 2 days, combustion chamber and remote control batteries yearly.\nDealer (yearly): flue gas chamber, flue and flue system, air supply, ventilation and fans, electrical parts, seals.\nThe value shown is the stove's interval counter; that it is the counter for the SERVICE message is an assumption.",
    h_setPoint:"When the room reaches this temperature the stove modulates down to minimum power (7 – 30 °C). The temperature is measured by the sensor chosen in the MULTICOMFORT menu on the remote: remote control, stove or wireless sensor.",
    h_flame:"Flame power 1 – 4. When the set point is reached the stove modulates to minimum power, but the selected level stays on the display. The actual power is shown under the buttons and in the history.",
    h_fan:"Speed of the warm air fan (Multifuoco). 0 = NATURAL MODE: fan off, quieter. For safety the fan cannot be switched off at high power: lower the power to 3 or 2 first. When you raise the power again, the fan starts automatically. Switching off may happen a bit later, when conditions allow it.",
    h_es:"Switches the stove off and on automatically based on the room temperature.\n• Set point reached: the stove goes to power 1.\n• Room keeps rising to set point + STOP: the stove extinguishes and goes to standby.\n• Room drops below set point + START: the stove restarts at the previous power.\nNot possible together with Multicomfort Plus or external thermostat STOP. If the pause between stopping and restarting is shorter than 90 minutes, the manual advises to switch energy saving off and let the stove modulate. After switching the stove off manually it does not restart automatically.",
    h_esStart:"Restart when the room drops below set point minus this value (−1 to −3 °C). OFF: after the automatic stop the stove stays off.",
    h_esStop:"Extinguish when the room reaches set point plus this value (+1 to +3 °C). Switching energy saving off sets STOP to OFF: the stove then only modulates down to power 1.",
    h_cq:"Combustion air correction. 0 = factory setting.\n• Higher (+): very dirty glass, too many pellets in the brazier, long combustion air duct, coaxial flue.\n• Lower (−): flame too small because of too much draught.\nDo not change together with pellet quality, change one step at a time and wait up to a day to judge the effect. The available values depend on the stove.\n+G is not described in either manual and lies far outside the normal range; its meaning is unknown, so it is better not to select it.",
    h_pq:"Pellet feed correction. 0 = factory setting.\n• Higher (+): small flame at maximum power, longer pellets, lower consumption than specified.\n• Lower (−): a lot of ash in the brazier, higher consumption than specified.\nDo not change together with combustion quality, change one step at a time. The available values depend on the stove.",
    h_beep:"Sound signal of the stove for messages. Even when switched off, the buzzer still sounds for safety warnings.",
    h_timers:"Up to 6 programs, each with one start and stop time (10 minute steps) and the days (1 = Monday). An empty time means OFF: START OFF = no ignition, STOP OFF = no switch-off.\n• Preferably use one program at a time; with combined programs leave at least 2 hours between stopping and starting.\n• With overlapping programs the stove starts at the first start time and stops at the first stop time.\n• With energy saving on, the chrono handles the start and stop times and energy saving the operation in between.\n• The stove clock (including the day of the week) must be correct.",
    h_clock:"The chrono timers use the stove clock, including the day of the week. The stove has no daylight saving time: set the clock again after the change.",
    h_errors:"The last 5 safety warnings stored by the stove (HOUR COUNTER MEMORY › MEM-AL). Deleting only clears this memory. Only restart the stove after the cause has been found and solved.",
    h_wireless:"INSTELL WIRELESS switches the optional external wireless temperature sensor on or off. Which sensor the stove regulates on is chosen in MULTICOMFORT (remote control, stove or wireless). Without contact with the remote or sensor for more than 4 minutes, the stove uses its own sensor.",
    h_roomSrc:"Derived from the readings: the room temperature the stove uses equals the sensor shown. The MULTICOMFORT setting itself cannot be read yet.",
    eh_32:"One of these safety devices tripped: pressure switch, door sensor or pellet hopper lid sensor (lid open longer than about 60 s). The auger stops and the stove shuts down.\nYou can check:\n• Is the brazier clogged with pellets or combustion residue? Clean it.\n• Are the fire door and the ash pan properly closed?\n• Is the pellet hopper lid closed? Refill if needed and close it.\nDealer: blocked flue or too little draught, flue too long, worn door or flue seals, blocked or broken pressure gauge connector or silicone tube, faulty flue gas fan, auger motor, hopper sensor or electronic board. Strong wind or bad weather can also trip the pressure switch.",
    eh_64:"Pressure switch fault at ignition; the stove shuts down.\nDealer: faulty pressure switch, chimney draws too hard or bad weather, faulty auger motor.",
    eh_16:"The temperature inside the stove exceeded the limit and the safety thermostat tripped; the auger stops and the stove shuts down.\nYou can check: use suitable pellets (A1, 6 mm, 10 – 30 mm long).\nDealer: blocked flue or too little draught, ventilation or heat dissipation problems (distances, ventilation, parameters, flue too long), faulty thermostat or electronic board. A thermostat with manual reset must be reset.",
    eh_2:"The flue gas temperature exceeded the safety limit; the auger stops and the stove shuts down.\nYou can check: use suitable pellets.\nDealer: blocked flue or too little draught, ventilation or heat dissipation problems, faulty or badly connected flue gas sensor, wrong parameters, faulty electronic board.",
    eh_128:"Auger fault during operation: pellets are fed continuously; the stove shuts down.\nDealer: faulty auger or electronic board, wrong parameters.",
    eh_8:"The flue gas temperature dropped below the minimum for operation; the stove shuts down.\nYou can check:\n• Is the pellet hopper empty or emptying irregularly? Refill.\n• Are suitable pellets used?\n• Is the brazier clean and not clogged?\nDealer: faulty electronic board.",
    eh_1:"The flue gas sensor is not working correctly.\nDealer: faulty sensor, pulled out of its holder or wrongly connected, or faulty electronic board.",
    eh_4:"During ignition the stove did not reach the ignition temperature in time.\nYou can check:\n• Pellet hopper empty or emptying irregularly: refill.\n• Unsuitable pellets (type, composition, size): use A1 pellets, 6 mm, 10 – 30 mm long, ≤ 6 % moisture.\n• Auger not completely filled, e.g. after an empty hopper or at first use: run FILL AUGER (only with the stove off and cooled down).\n• Brazier not clean or clogged: clean the brazier and its holes, and push it back towards the ignition hole.\nDealer: faulty or disconnected igniter, faulty electronic board.\nIrregular failed ignitions can also be caused by a too low mains voltage.",
    eh_129:"The flue gas fan is not working correctly; the stove shuts down.\nDealer: faulty or disconnected encoder, faulty electronic board or fuses.",
    eh_132:"An external safety device on the N.PEL / PELLET contact tripped; the stove shuts down.\nDealer intervention is required.",

    wifiConfirmRestart:"Bewaren en de controller herstarten? Hij is daarna bereikbaar op {0}. Bij een nieuw vast adres: open de app daar binnen 5 minuten, anders schakelt hij zelf terug naar DHCP.",
    wifiFormNote:"Wijzigingen zijn actief na een herstart. Een nieuw vast adres moet bevestigd worden: open de app daarop binnen 5 minuten, anders gaat de controller terug naar DHCP.",
    h_wifi:"WiFi-verbinding en IP-instellingen van de controller. Met 'Ander netwerk' schakel je over naar een ander WiFi-netwerk (met automatische terugval), met 'IP-instellingen' stel je hostname en DHCP / vast IP in. Zonder werkend netwerk: houd de resetknop 5 s ingedrukt en verbind met het toegangspunt 'Pellet heater controller' (WiFiManager-portaal).",

    mqttNone:"Niet beschikbaar (oudere firmware)", mqttOff:"Uit", mqttConnected:"Verbonden met {0} – topics {1}/…", mqttDisconnected:"Niet verbonden met {0}: {1}", mqttPassKeep:"ongewijzigd", mqttSaved:"MQTT-instellingen bewaard", cancel:"Annuleren",
    h_mqtt:"Publiceert de waarden van de kachel naar een MQTT-broker en aanvaardt commando's. Waarden staan als gewone tekst onder <prefix>/state/… (bv. room_temp = 21.5, power = ON), retained, bij elke wijziging en elke 5 min. Commando's gaan naar <prefix>/set/…: power en energy_saving (ON / OFF of 1 / 0), mode (heat / off), setpoint (7 – 30), flame_power (1 – 4), fan_speed (off / 0 – 3), es_stop en es_start (0 – 3). <prefix>/status is online / offline. Met Home Assistant discovery aan verschijnt de kachel vanzelf in Home Assistant (thermostaat, schakelaars, getallen, sensoren). Andere systemen zoals Loxone (via een MQTT-gateway) of Node-RED gebruiken dezelfde topics; discovery mag voor hen uit.",
    wxTitle:"Verbruik tegenover de buitentemperatuur", h_wx:"Elk punt is één dag: de gemiddelde buitentemperatuur van die dag (Open-Meteo, open source weergegevens, opgehaald door deze browser voor de locatie die je met Locatie… instelt) tegenover de verbrande pellets. De lijn is de trend: hoeveel kg per dag meer per graad kouder. Per graaddag: kg per graaddag (18 °C − de gemiddelde buitentemperatuur, dagen boven 18 °C tellen 0), een maat voor het rendement die niet van het weer afhangt; stijgt die over de maanden, dan heeft de kachel of het huis meer pellets nodig voor dezelfde kou (vuil, andere pellets, ventilatie). Komende 7 dagen: kg per graaddag toegepast op de graaddagen van de weersverwachting, of de trend zodra die betrouwbaar is (10 dagen, samenhang minstens 50 %). De trendlijn en 'per graad kouder' verschijnen vanaf 10 dagen; met timers en energy saving kan de samenhang zwak blijven. Vandaag en de eerste, onvolledige dag tellen niet mee. De locatie wordt op de controller bewaard, afgerond op ~1 km; alleen deze browser stuurt ze naar Open-Meteo.",
    planTitle:"Leesplanner", h_plan:"Hoe de controller de kachel uitleest (GET /api/plan, elke 2 s ververst). Elke groep registers heeft een eigen interval, per toestand van de kachel (actief: opstarten, branden, reinigen, alarm; rust: uit, stand-by). De balk loopt vol tot de volgende lezing: bij 100 % is de groep aan de beurt (oranje: over tijd). De planner leest eerst de belangrijkste groep die aan de beurt is en houdt de bus maar één groep vast; een opdracht (web, MQTT, telnet, Bluetooth) krijgt de bus vóór het volgende register ('afgestaan'). Vrije bustijd, tot 50 %, ververst instellingen en timers vaker. Staat er een menu open op de afstandsbediening, dan worden die instellingen om de paar seconden gelezen.",
    useTitle:"Pelletverbruik", h_use:"Verbrande pellets per dag, uit de schroefteller (schroefwaarde × tijd, dezelfde als voor de schatting). Per dag bewaard op de controller, tot 400 dagen; de dagen van vóór deze functie zijn aangevuld uit de uurgeschiedenis van 7 dagen. De kilo's gebruiken de ijking van nu, zodat ook oudere dagen nauwkeuriger worden bij elke bijvulcyclus. Prijs…: de prijs van een zak en zijn gewicht (€ per kg volgt daaruit). Voorraad…: de zakken die je thuis hebt; elke bijvulling (herkend of ingegeven) haalt zijn kilo's daaruit, en de voorraad wordt getoond in dagen bij het verbruik van de laatste 7 dagen. Vandaag is lichter getekend: die dag loopt nog.",
    pelDbgTitle:"Pelletschatting (debug)", h_pelDbg:"Alles waaruit de pelletschatting bestaat, uit GET /api/pellets (elke 10 s ververst zolang debug aan staat). De controller telt 'schroefeenheden' op: de aan-tijd van de schroef per cyclus (RAM 0x0D, hoogstens 12 s) maal het aantal seconden dat ze voedde. De niveausensor (RAM 0xA4) slaat telkens op dezelfde hoogte aan, dus tussen twee alarmen is precies de bijgevulde hoeveelheid verbrand: kg per eenheid = kg / eenheden. Over = kg bijgevuld sinds het laatste alarm − kg per eenheid × eenheden sinds dat alarm; uren = over / (kg per eenheid × schroefwaarde × 3600). De controles bovenaan tonen wat meestal misloopt: nog geen alarm of bijvulling gezien, sensorwaarden die de teller negeert, meer verbrand dan bijgevuld (verkeerde hoeveelheid), gaten in de metingen, cycli die niet overeenkomen. 'Kopieer' zet de ruwe JSON op het klembord voor een foutmelding.",
    parTitle:"Parameters (EEPROM)", h_par:"Presets in het EEPROM van de kachel, live gelezen (GET /api/dump). 'Bevestigd' = nagekeken op deze kachel. De presets per vermogen zijn de waarden die de kachel per vlamvermogen gebruikt; de rij van het huidige werkelijke vlamvermogen is gemarkeerd.",
    parPresets:"Presets per fase en vermogen", parPhases:"Opstart, reiniging en alarm (installateursparameters Pr01 – Pr22 op EEPROM-adres Pr − 1, zoals in de Micronova L023-handleiding)", parCReg:"Register", parCManual:"In de handleiding", parCName:"Betekenis", parCVal:"Waarde", parUser:"Instellingen (menuparameter-id = EEPROM-adres + 1)", parCMenu:"Menuparameter", parTimers:"Timerprogramma's (uit /api/timers)", parCProg:"Programma", parCOn:"Aan", parCOff:"Uit", parCDays:"Dagen", parCSet:"Temp.", parCFlame:"Vlam", parCFan:"Ventilator", parLevel:"Niveau", parAuger:"Schroefwaarde", parFume:"Doeltoerental rookgasventilator", parNow:"nu",

    liveNote:"Log: wat de firmware naar de seriële poort (Serial, UART0) schrijft (laatste 8 KB, ook van vóór je dit opende). Kachelbus: elke lees- en schrijfopdracht op de bus naar de kachel, enkel opgenomen zolang dit scherm open is.",
    h_live:"Firmware-log: de meldingen van de controller-firmware (WiFi, MQTT, updates, fouten), dezelfde als op de seriële poort, met het tijdstip. Uitvoer van sommige ingebouwde bibliotheken zit er niet in. Kachelbus: elke lees- en schrijfopdracht tussen de controller en de kachel, één regel per opdracht: tijd, actie, register (RAM of EEPROM en adres), waarde (decimaal en hex) en wat de waarde betekent volgens de gekende registertabel (in het Engels). Bij een gewijzigde waarde staat de vorige erbij (← was …). Met 'Enkel wijzigingen' (standaard aan) zie je de eerste lezing van elk register en daarna enkel wat verandert, schrijfopdrachten en fouten; de kleuren staan onder de uitvoer uitgelegd. Filter op adressen om registers te volgen, bv. terwijl je toetsen indrukt op de afstandsbediening. De busmonitor neemt enkel op zolang dit scherm open is en stopt vanzelf 60 s nadat je het verlaat. Na een herstart begint de log met de laatste regels van ervoor (bewaard in RTC-geheugen, ook na een crash, niet na een stroomonderbreking). De logniveaus per module bepalen hoeveel elk deel van de firmware schrijft (bewaard op de controller).",

    pelReserve:"Pelletreserve", pelReserveVal:"Aan · sensor {0} · teller {1}", h_pelReserve:"PELLET RESERVE (installateursmenu, EEPROM 0xC6). Gezien op deze kachel (17/11 en 20/11/2026): als de niveausensor (RAM 0xA4) weinig pellets ziet, wordt hij 5 en telt de teller (RAM 0x89) af van 20 naar 0, één stap per minuut. Daarna toont de afstandsbediening PELLET RESERVE met de resterende minuten, en brandt de kachel nog 30 minuten op vlamvermogen 1 (RAM 0x91). Dan schakelt ze zichzelf uit: de afstandsbediening toont OFF / PELLET BESTEED, en de controller meldt de fout PELLETS en blokkeert aanzetten tot de pellettank bijgevuld is. Na het bijvullen telt de sensor af 5 → 4 → … → 0, één stap ongeveer elke 37 s terwijl de kachel brandt: pas bij 0 heeft de kachel de pellets bevestigd. Intussen toont de app 'Pellets bijgevuld – de kachel bevestigt ze' in plaats van de melding over lage pellets. Een losse 4 tussen twee keer 5 zijn pellets die langs de sensor glijden, geen bijvulling. Bijvullen tijdens de laatste 30 minuten hield de kachel aan (23/11/2026). Elke wijziging van de sensor komt in de lijst met toestandswissels.", evtError:"Fout", evtErrOn:"{0} opgetreden", evtErrOff:"Fout opgelost", errSeen:"opgetreden op {0}", errSeenUnknown:"tijdstip onbekend (vóór de start van het logboek)", evtWhen:"Tijdstip", evtFrom:"Van", evtTo:"Naar", evtDur:"Duur", evtNone:"Nog geen toestandswissels geregistreerd.", evtNow:"nu",

    h_buzzer:"De zoemer op de controllerprint (niet de zoemer van de kachel zelf). Elke gebeurtenis heeft haar geluid; Test speelt het af (ook als de zoemer uit staat). Druk op de knop: kort drukken op de knop van de print; dat zet ook een alarm stil. Firmware-update klaar: een nieuwe firmware bevestigd na een update. Pelletreserve: als het pelletreserve-alarm van de kachel begint. Aftelling bij een fout: de kachel telt ~55 s af voor ze op een fout reageert; elke seconde een piep, sneller in de laatste 10 s. Alarm / fout kachel: herhaalt tot de fout weg is of stilgezet wordt. Stille uren (lokale tijd): geen geluid, eventueel behalve alarm en aftelling. MQTT: <prefix>/set/buzzer (ON / OFF), buzzer_play (een geluid), buzzer_stop.",
    h_https:"Versleutelde toegang via https:// op poort 443, naast gewone HTTP op poort 80. Het certificaat wordt op de controller zelf gemaakt (een eigen ECDSA P-256-sleutel die het toestel nooit verlaat) voor de hostnaam, hostnaam.local en het IP-adres, en automatisch vernieuwd met dezelfde sleutel als een van die drie verandert. Het is zelfondertekend: de browser waarschuwt de eerste keer. Kijk of de SHA-256-vingerafdruk die de browser toont dezelfde is als hier en aanvaard hem dan; of download het certificaat en installeer het als vertrouwd op je eigen toestellen (dan geen waarschuwing). Een TLS-verbinding vraagt ~40 KB geheugen: de controller bedient er één tegelijk en weigert ze als het geheugen krap is (HTTP blijft werken).",

    h_telnet:"Interactief debugmenu via telnet (poort 23): live waarden, instellingen, rechtstreekse registertoegang. Telnet heeft geen wachtwoord en geen versleuteling; zet het uit als je het niet gebruikt. De wijziging geldt meteen, zonder herstart.",
    h_apiKey:"Beveiligt de HTTP-API met een key. De key wordt bij de eerste start willekeurig aangemaakt en blijft op de controller bewaard. Is ze verplicht, dan heeft elke aanroep de header X-API-Key: <key> nodig (of Authorization: Bearer <key>, bv. voor Prometheus). Zonder key bereikbaar: de toestelpagina, deze web-app, de API-documentatie en /api/auth. Gewone HTTP is niet versleuteld: de key beschermt tegen andere toestellen en webpagina's op je netwerk, niet tegen iemand die het netwerkverkeer afluistert. Het telnetmenu en Bluetooth worden niet door de key beschermd.",

    h_bt:"Bluetooth uitschakelen slaat BLE volledig over bij het opstarten van de controller: geen Bluetooth-advertising of -verbindingen, het Bluetooth-geheugen wordt vrijgegeven en WiFi moet de radio niet meer delen (geen energiebesparende modus nodig). Dat geeft meestal een snellere en stabielere WiFi-verbinding. De iOS-app werkt dan enkel via WiFi. De wijziging wordt toegepast met een herstart van de controller; de kachel blijft gewoon werken.",
    serviceOf:"{0} / 2000 u", tpHour:"Uur", tpMin:"Minuten", tpOff:"OFF", tpDone:"Klaar",

// ---------- alerts ----------
function renderAlerts() {
  renderConsoleBtn();
  const host = $("alerts"); host.innerHTML = "";
  const add = (level, title, sub) => {
    const a = el("div", "alert " + level);
    a.append(el("span", "ic", level === "critical" ? "⛔" : level === "ok" ? "✓" : "⚠"));
    const tx = el("div", "", title); if (sub) tx.appendChild(el("small", "", sub));
    a.appendChild(tx); host.appendChild(a);
  };
  if (offline) { add("critical", t("aOffline"), t("aOfflineSub")); return; }
  if (!state) return;
  const code = state.stoveState ? state.stoveState.stoveState : null;
  if (code === -1) add("critical", t("aNoAnswer"), t("aNoAnswerSub"));
  else if ([8, 9, 10].includes(code)) add("critical", t("aAlarm", STATE_NAME[lang][code]), t("aAlarmSub"));
  // error the stove reports right now, with its countdown to the alarm (RAM 0x30); in the
  // transitional states short pre-warnings occur (E1 at the start-up check, E12 at cleaning)
  const pe = state.pendingError, peShown = pe && pe.secondsLeft != null && ![8, 9, 10].includes(code);
  if (state.currentError && state.currentError.source !== "controller" && !(peShown && state.currentError.id === pe.id))
    add("critical", t("aError", state.currentError.error),   // LINK: already the "no answer" alert
      errDesc(state.currentError) + (I18N.en["eh_" + state.currentError.id] ? " — " + t("eh_" + state.currentError.id) : ""));
  if (peShown) add([1, 2, 3, 5, 6].includes(code) ? "warning" : "critical", t("aPending", pe.error, pe.secondsLeft), t("aPendingSub", errDesc(pe)));
  // pellets: the level sensor (RAM 0xA4 = 5) starts a countdown (RAM 0x89, ~1 per minute) to the reserve alarm
  const pr = state.pelletReserve || {};
  const prLow = pr.sensor >= 1 && pr.sensor <= 5;   // 4 / 3: seen briefly during the reserve and the refill
  // RAM 0xA4 counting down 3 -> 0 after a refill: the stove confirms the pellets (~37 s a step while burning)
  if (pr.refilling) add("ok", t("aRefill"), t(pelletsEmpty(state) ? "aRefillOffSub" : "aRefillSub", fmtDur(Math.ceil((pr.refillConfirmSeconds || 0) / 60) * 60)));   // whole minutes, rounded up
  else if (pelletsEmpty(state)) add("critical", t("aEmpty"), t("aEmptySub"));                         // the stove switched itself off
  else if (pr.shutdownMinutes != null) add("critical", t("aLow"), t("aLowOff", pr.shutdownMinutes));   // phase 2: the stove switches off
  else if (state.lowPalletAlarm) add("warning", t("aLow"), t("aLowSub"));
  else if (prLow && pr.minutesLeft > 0) add("warning", t("aLow"), t("aLowMin", pr.minutesLeft));
  // warnings: the stove works, but probably not as intended (not an error, see /api/state warnings)
  for (const w of state.warnings || []) {
    if (w.id === "REMOTE_SENSOR_NOT_USED")
      add("warning", t("wRemoteSensor"), t(state.RemoteControlLastSeen == null || state.RemoteControlLastSeen < 0 ? "wRemoteSensorOff" : "wRemoteSensorOn",
          fmtTemp(tp0w(state).stove), fmtTemp(tp0w(state).remoteControl)));
    else if (w.id === "CHIP_TEMP_HIGH") add("warning", t("wChipTemp"), t("wChipTempSub", fmtTemp(state.controller && state.controller.chipTemp)));
    else add("warning", w.id, w.desc);
  }
  const age = state.dataAge ? state.dataAge.fastSeconds : null;
  if (age !== null && age !== undefined && age > 30) add("warning", t("aStale", age), t("aStaleSub"));
}

// ---------- main render ----------
function brazierText(b) {
  if (!b) return "–";                       // firmware without brazierCleaning

  let best = null;
  for (const [name, tm] of Object.entries(timersData)) {

      if (!tm.enabled_on || !tm.enabled_on[DAYS[dow]]) continue;
      for (const [kind, hm] of [["on", tm.on], ["off", tm.off]]) {
        if (!hm || hm === "off") continue;
        const [h, m] = hm.split(":").map(Number);

  const when = best.d === 0 ? t("today") : best.d === 1 ? t("tomorrow") : DAY_LONG[lang][(best.at.getDay() + 6) % 7];
  const time = fmtHM(best.at);
  set(t(best.kind === "on" ? "nextOn" : "nextOff", best.name, time, when), time);
}

function renderChronoLcd(lcd, c, ev) {

  const fromStr = sv => { const m = /^(\d\d):(\d\d)$/.exec(sv || ""); return m ? (+m[1] * 60 + +m[2]) / 10 : 144; };

    7: DAYS.reduce((m, d, i) => m | (days[d] ? 1 << i : 0), 0),

  top.appendChild(dw);

    const b = el("div", "chbox " + cls + (icon ? " ci" : "") + hi(off));

function renderLcd() {

  if (param === 123) {

        "DATA BANK=–",                                            // shows 08 on this stove: register unknown
        state.firmwareVersion || "FW –",
      ] : ev === 2 ? [
        "SENSOR 1=–",                                             // wireless sensor 1 (shows DISAB): register unknown
        "ID SENSOR 1=–",

        L("ROOKG", "SMOKE") + "=" + (tp.fume !== undefined ? String(Math.trunc(tp.fume)).padStart(3, "0") : "–") + "°",
        "RPM/ASP=" + (state.fumeFanRPM ?? "–"),

// ---------- use against the outdoor temperature (Open-Meteo, fetched by the browser) ----------
// Daily mean outdoor temperature for the location kept on the controller (usage.location). The
// forecast API covers the last 92 days and the next week; older days come from the archive API.
let wx = null, wxKey = "", wxAt = 0, wxErr = "";
const isoDay = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
async function loadWeather() {

      (a.daily && a.daily.time || []).forEach((t, i) => { const v = a.daily.temperature_2m_mean[i]; if (v != null && temps[t] === undefined) temps[t] = v; });
    }
    wx = { temps, forecast: fc.slice(0, 7) }; wxKey = key; wxAt = Date.now(); wxErr = "";

  renderWeather();
}

// ---------- polling ----------
let pollTimer = null, polling = false;
async function poll() {

  polling = true;
  try {
    const { data } = await api("GET", "/api/state");
    // new firmware on the controller (another build): load the page again, so this tab does
    // not keep running the old web app (a 304 when it did not change, see ETag in routesBasic.h)
    const built = data.controller && data.controller.built;
    if (built && loadedBuild && built !== loadedBuild && !busy) { location.reload(); return; }
    if (built && !loadedBuild) loadedBuild = built;
    state = data; offline = false; render(data); applyReach();
    // the controller answered: its dot is green; the stove dot tells about the serial link
    setConn(true, t("updated", new Date().toLocaleTimeString(lang === "nl" ? "nl-BE" : "en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" })));
    renderStoveConn(data);
  } catch (e) {
    // the controller is installing a firmware: it answers, but only the update status
    if (e.fwUpdate) { setConn(true, L("Firmware-update bezig… ", "Firmware update in progress… ") + (e.progress || 0) + " %", true); if (!fwDownloading()) loadFw(); }
    else { offline = true; setConn(false, t("offline")); renderStoveConn(null); renderAlerts(); applyReach(); }
  }
  finally { polling = false; pollTimer = setTimeout(poll, POLL_MS); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll(); pollRemote(); } });

applyStatic(); applyExpert(); renderTimers();
// Read the remote first so the page starts in the right language
pollRemote().finally(() => poll().then(() => { loadTimers(); loadHistory(); loadBt(); loadSecurity(); loadLeds(); loadMqtt(); loadWifi(); loadFw(); loadParams(); loadPelDbg(); loadUse(); loadBuzzer(); }));
setInterval(() => { if (!document.hidden && !offline) { loadMqtt(); loadWifi(); if (!fwInfo || !["checking", "downloading", "restarting"].includes(fwInfo.state)) loadFw(); } }, 30000);
</script>
